<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthAI | Real-Time LLM Powered</title>
    <style>
        :root {
            --primary-color: #0056b3; 
            --secondary-color: #f0f7ff;
            --accent-color: #00c853; 
            --emergency-color: #d32f2f; 
            --text-dark: #333;
            --text-light: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), #007bff);
            color: var(--text-light);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            justify-content: space-between;
        }

        .header-left { display: flex; align-items: center; }
        .header-info h3 { margin: 0; font-size: 1.2rem; }
        .header-info p { margin: 2px 0 0; font-size: 0.8rem; opacity: 0.8; }
        .status-dot { height: 10px; width: 10px; background-color: var(--accent-color); border-radius: 50%; margin-right: 10px; border: 2px solid #fff; }
        .secure-badge { font-size: 0.7rem; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--secondary-color);
        }

        .message { margin-bottom: 15px; max-width: 85%; clear: both; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bot-message { float: left; }
        .user-message { float: right; }

        .message-content {
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .bot-message .message-content { background-color: #fff; color: var(--text-dark); border-bottom-left-radius: 5px; }
        .user-message .message-content { background-color: var(--primary-color); color: var(--text-light); border-bottom-right-radius: 5px; }

        .emergency-alert { background-color: #ffebeb !important; border-left: 5px solid var(--emergency-color); color: var(--emergency-color) !important; font-weight: bold; }

        .chat-footer { padding: 10px; background-color: #fff; border-top: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        .input-group { flex: 1; position: relative; display: flex; align-items: center; background-color: #f0f2f5; border-radius: 24px; padding: 5px 15px; }
        #userInput { flex: 1; border: none; background: transparent; padding: 10px; font-size: 1rem; outline: none; }
        
        .icon-btn { background: none; border: none; color: var(--primary-color); font-size: 1.2rem; cursor: pointer; padding: 8px; border-radius: 50%; transition: all 0.2s;}
        .icon-btn:hover { background-color: #e6f0ff; }
        .icon-btn.recording { color: red; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #sendBtn { background-color: var(--primary-color); color: white; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%;}
        
        .typing-indicator { color: #888; font-size: 0.8rem; margin-bottom: 10px; margin-left: 10px; display: none; clear: both;}
        
        /* Markdown/HTML Formatting from AI */
        .ai-formatted ul { margin: 5px 0 10px 20px; padding: 0; }
        .ai-formatted strong { color: var(--primary-color); }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <div class="chat-header">
        <div class="header-left">
            <div class="status-dot"></div>
            <div class="header-info">
                <h3>AI Health Assistant</h3>
                <p><i class="fas fa-brain"></i> Powered by Gemini Pro</p>
            </div>
        </div>
        <div class="secure-badge"><i class="fas fa-lock"></i> Encrypted</div>
    </div>

    <div class="chat-body" id="chatBody"></div>
    
    <div id="typing" class="typing-indicator">AI is analyzing symptoms...</div>

    <div class="chat-footer">
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Type or say symptoms..." autocomplete="off">
            <button class="icon-btn" id="micBtn" title="Speak"><i class="fas fa-microphone"></i></button>
        </div>
        <button class="icon-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ PASTE YOUR API KEY HERE
    // ==========================================
    const API_KEY = "AIzaSyD6t7_a3XuOc_sM6ZgkZp5QeKT-07cPHZs"; 
    // ==========================================

    const chatBody = document.getElementById('chatBody');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const typingIndicator = document.getElementById('typing');

    let dynamicModelUrl = ""; 
    let recognition; 

    // --- MOCK DATABASE (Simulating 1000 combinations) ---
    // In a real app, this would be an API call or a larger JSON file
    const symptomDatabase = [
        { keywords: ["heart attack", "chest pain", "arm pain"], diagnosis: "Potential Myocardial Infarction", isEmergency: true, response: "WARNING: Symptoms suggest a heart attack. Call Emergency Services immediately." },
        { keywords: ["cold", "runny nose", "sneeze"], diagnosis: "Common Cold", isEmergency: false, response: "It sounds like the common cold. Rest, hydration, and over-the-counter decongestants are recommended." },
        { keywords: ["migraine", "headache", "light sensitivity"], diagnosis: "Migraine", isEmergency: false, response: "This matches Migraine symptoms. Rest in a dark, quiet room and consider pain relief medication." }
    ];

    // --- INITIALIZATION ---
    window.onload = async () => {
        addBotMessage("Initializing connection...");
        try {
            await findWorkingModel();
            setupVoiceRecognition();
            // CHANGED: First statement updated as requested
            addBotMessage("<strong>Your AI agent is ready.</strong><br>I have access to a medical database of symptom combinations.<br><br>How can I help you?");
        } catch (e) {
            addEmergencyMessage("<strong>Setup Failed:</strong> " + e.message);
        }
    };

    // --- VOICE RECOGNITION SETUP ---
    function setupVoiceRecognition() {
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                micBtn.classList.add('recording');
                userInput.placeholder = "Listening...";
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                userInput.placeholder = "Type or say symptoms...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                handleUserInput(); // Auto-send on voice stop
            };

            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('recording')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });
        } else {
            micBtn.style.display = 'none';
            console.warn("Web Speech API not supported in this browser.");
        }
    }

    async function findWorkingModel() {
        const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`;
        const response = await fetch(listUrl);
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);
        
        const validModels = data.models.filter(m => 
            m.supportedGenerationMethods.includes("generateContent") && 
            m.name.includes("gemini")
        );

        if (validModels.length === 0) throw new Error("No chat models found.");
        let bestModel = validModels.find(m => m.name.includes("flash")) || validModels[0];
        dynamicModelUrl = `https://generativelanguage.googleapis.com/v1beta/${bestModel.name}:generateContent?key=${API_KEY}`;
    }

    // --- MAIN CHAT LOGIC ---
    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleUserInput(); });

    async function handleUserInput() {
        const text = userInput.value.trim();
        if (!text) return;

        addUserMessage(text);
        userInput.value = '';
        
        typingIndicator.style.display = 'block';
        chatBody.scrollTop = chatBody.scrollHeight;

        // 1. Check Mock Database First (Local Triage)
        const dbResult = checkLocalDatabase(text);
        if (dbResult) {
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                if (dbResult.isEmergency) {
                    addEmergencyMessage(dbResult.response);
                } else {
                    addBotMessage(dbResult.response);
                }
            }, 800); // Fake delay for realism
            return;
        }

        // 2. Check for Appointment/Booking Logic
        if (text.toLowerCase().includes("book") || text.toLowerCase().includes("appointment") || text.toLowerCase().includes("schedule")) {
             setTimeout(() => {
                typingIndicator.style.display = 'none';
                addBotMessage(`<strong>Appointment Scheduled.</strong><br>I have sent a confirmation email to your registered address.<br><br>Ref ID: #${Math.floor(Math.random()*10000)}`);
            }, 1000);
            return;
        }

        // 3. Fallback to LLM
        try {
            if (!dynamicModelUrl) throw new Error("AI not initialized.");
            
            const aiData = await getAIResponse(text);
            
            typingIndicator.style.display = 'none';

            if (aiData.isEmergency) {
                addEmergencyMessage(aiData.message);
            } else {
                addBotMessage(aiData.message);
            }

        } catch (error) {
            console.error(error);
            typingIndicator.style.display = 'none';
            addBotMessage("I'm having trouble connecting. Please <strong>consult a doctor</strong> regarding: " + text);
        }
    }

    function checkLocalDatabase(text) {
        const lowerText = text.toLowerCase();
        // Simple keyword matching against our mock "1000 record" database
        for (let entry of symptomDatabase) {
            // If all keywords for an entry are present in the user text
            if (entry.keywords.every(k => lowerText.includes(k))) {
                return entry;
            }
        }
        return null;
    }

    async function getAIResponse(userText) {
        // Updated System Prompt: NO SUGGESTION CHIPS/BUTTONS
        const systemPrompt = `
            You are a medical triage AI acting as a frontend for a database of 1000 symptom combinations.
            
            RULES:
            1. Analyze the user's symptoms in natural language.
            2. If symptoms are vague (e.g., "my tummy hurts"), ask clarifying questions (Where exactly? Sharp or dull?).
            3. If symptoms suggest an emergency (Heart attack, stroke, severe bleeding), set "isEmergency": true.
            4. DO NOT provide "buttons" or "suggestion chips". Provide the advice directly in the "message" text.
            5. RETURN JSON ONLY. Structure: {"isEmergency": boolean, "message": "HTML string"}
            
            User Input: ${userText}
        `;

        const payload = {
            contents: [{
                parts: [{ text: systemPrompt }]
            }]
        };

        const response = await fetch(dynamicModelUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error("Empty response from AI");

        const jsonText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        return JSON.parse(jsonText);
    }

    // --- UI HELPERS ---
    function addUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'message user-message';
        div.innerHTML = `<div class="message-content">${text}</div>`;
        chatBody.appendChild(div);
        scrollToBottom();
    }

    function addBotMessage(htmlContent) {
        const div = document.createElement('div');
        div.className = 'message bot-message';
        // Removed suggestion chip logic here
        div.innerHTML = `<div class="message-content ai-formatted">${htmlContent}</div>`;
        chatBody.appendChild(div);
        scrollToBottom();
    }

    function addEmergencyMessage(text) {
        const div = document.createElement('div');
        div.className = 'message bot-message';
        div.innerHTML = `<div class="message-content emergency-alert"><i class="fas fa-exclamation-triangle"></i> ${text}</div>`;
        chatBody.appendChild(div);
        scrollToBottom();
    }

    function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
    }
</script>
</body>
</html>
